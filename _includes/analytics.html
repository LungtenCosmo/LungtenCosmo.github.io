{% comment %}GA4 activates after ga_measurement_id is configured in _config.yml.{% endcomment %}
{% if site.ga_measurement_id and site.ga_measurement_id != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga_measurement_id | escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', '{{ site.ga_measurement_id | escape }}');
</script>
{% endif %}
